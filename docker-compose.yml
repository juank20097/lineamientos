services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "False"
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    networks:
      - internal
    expose:
      - "8000"
    healthcheck:
      # Solo verifica que Gunicorn acepta conexiones TCP en el puerto 8000;
      # no se usa una peticion HTTP completa porque Django valida el header
      # Host contra DJANGO_ALLOWED_HOSTS y rechazaria "localhost" con 400.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # habilitar junto con la config SSL en nginx/conf.d
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # certificados SSL, si se habilita 443
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal
      - red-interna-sdnas

volumes:
  media_volume:
  static_volume:

networks:
  internal:
    driver: bridge
  red-interna-sdnas:
    external: true