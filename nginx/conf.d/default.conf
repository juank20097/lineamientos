upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Estaticos servidos directamente por nginx bajo el mismo prefijo con el
    # que Django los genera (STATIC_URL = FORCE_SCRIPT_NAME + '/static/').
    location /tools/lineamientos/static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gunicorn/WSGI (a diferencia de un servidor ASGI con middleware de script
    # name) hace el resolve de rutas con el PATH_INFO tal cual llega: no lee
    # FORCE_SCRIPT_NAME para recortar la entrada, solo lo usa para generar
    # URLs salientes. Por eso aqui SI se recorta el prefijo antes de
    # reenviar (proxy_pass con barra final -> nginx quita todo lo que hizo
    # match en el location), y Django ve las rutas "limpias" (/home/, etc.)
    # igual que si estuviera en la raiz; el prefijo vuelve a aparecer solo
    # cuando Django genera URLs gracias a FORCE_SCRIPT_NAME.
    location /tools/lineamientos/ {
        proxy_pass http://django/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        #proxy_set_header X-Forwarded-Prefix /tools/lineamientos;   <-- quitar
        proxy_set_header SCRIPT_NAME /tools/lineamientos;
    }
}

# Para habilitar HTTPS: agregar un segundo bloque `server { listen 443 ssl; }`
# con las rutas a los certificados montadas en ./nginx/certs, y descomentar
# el puerto 443 y el volumen de certs en docker-compose.yml.
